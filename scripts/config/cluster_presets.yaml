# GPU/cluster presets for launching experiments from ./scripts
#
# These presets are intentionally *minimal* and only cover the values that
# routinely differ between machines (GPU count, batch sizes, mixed precision).
#
# All scripts read paths from environment variables (DATASET/MODEL roots).

presets:
  default:
    description: "Baseline preset (edit as needed)"
    num_gpus: 8
    cuda_visible_devices: "0,1,2,3,4,5,6,7"
    mixed_precision: "fp16"
    # Video model (SVD) finetune
    svd_train_batch_size: 6
    svd_gradient_checkpointing: true
    # Actor/policy training (Calvin)
    actor_batch_size: 28
    actor_devices: 8

  rtx5090_4gpu_reduced:
    description: "Reduced preset for 4× RTX 5090 (24GB)"
    num_gpus: 4
    cuda_visible_devices: "0,1,2,3"
    mixed_precision: "fp16"
    svd_train_batch_size: 2
    svd_gradient_checkpointing: true
    actor_batch_size: 12
    actor_devices: 4

  a800_8gpu:
    description: "8× A800 preset"
    num_gpus: 8
    cuda_visible_devices: "0,1,2,3,4,5,6,7"
    mixed_precision: "bf16"
    svd_train_batch_size: 6
    svd_gradient_checkpointing: true
    actor_batch_size: 28
    actor_devices: 8

